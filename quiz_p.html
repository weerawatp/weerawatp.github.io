จเป็นหน่วยงานของรัฐ","ข":"ได้ ถ้าคณะกรรมการรัฐวิสาหกิจมีมติ","ค":"ไม่ได้ เพราะเป็นข้อพิพาทระหว่างหน่วยงานของรัฐด้วยกันเอง","ง":"ไม่ได้ เพราะรัฐวิสาหกิจต้องใช้ทนายความของตนเองเสมอ"},"answer":"ค"},{"id":65,"question":"นาย ข. ราษฎร เข้าช่วยเหลือเจ้าพนักงานตำรวจซึ่งกำลังจับกุมคนร้ายในหน้าที่ แล้วถูกคนร้ายฟ้องเป็น คดีอาญาฐานทำร้ายร่างกาย ข้อใดถูกต้อง","options":{"ก":"พนักงานอัยการต้องแก้ต่างให้ทุกกรณี","ข":"พนักงานอัยการรับแก้ต่างให้ได้เมื่อเห็นสมควรตามมาตรา 14 (4)","ค":"พนักงานอัยการแก้ต่างให้ไม่ได้ เพราะนาย ข. ไม่ใช่เจ้าหน้าที่ของรัฐ","ง":"พนักงานอัยการต้องเป็นโจทก์ฟ้องคนร้ายกลับตามมาตรา 14 (6)"},"answer":"ข"},{"id":66,"question":"นาย ค. ราษฎร กระทำการตามคำสั่งโดยชอบของเจ้าหน้าที่ของรัฐ ต่อมาถูกฟ้องเป็นคดีปกครอง ข้อใด ถูกต้องตามมาตรา 14 (4) ี","options":{"ก":"พนักงานอัยการรับแก้ต่างให้ได้เมื่อเห็นสมควร","ข":"พนักงานอัยการมีหน้าที่ต้องแก้ต่างให้","ค":"พนักงานอัยการแก้ต่างได้เมื่อ ก.อ. อนุมัติ","ง":"กรณีนี้ไม่อยู่ในมาตรา 14 (4) เพราะบทบัญญัติส่วนราษฎรครอบคลุมเฉพาะคดีแพ่งหรือคดีอาญา"},"answer":"ง"},{"id":67,"question":"นิติ บุคคลแห่งหนึ่งซึ่งมิใช่หน่วยงานของรัฐ แต่จัดตั้งขึ้นโดยพระราชบัญญั ติ ถูกเอกชนฟ้องเป็นคดีแพ่ ง","options":{"ก":"พนักงานอัยการรับแก้ต่างให้ได้เมื่อเห็นสมควรตามมาตรา 14 (5)","ข":"รับไม่ได้ เพราะไม่ใช่หน่วยงานของรัฐ","ค":"เป็นอำนาจและหน้าที่ตามมาตรา 14 (3) า","ง":"รับได้เฉพาะในกระบวนการอนุญาโตตุลาการ"},"answer":"ก"},{"id":68,"question":"มูลนิธิเอกชนซึ่งจดทะเบียนตามประมวลกฎหมายแพ่งและพาณิชย์ ขอให้พนักงานอัยการว่าต่างคดีแพ่งให้ ข้อใดถูกต้อง","options":{"ก":"รับได้ตามมาตรา 14 (5) เพราะเป็นนิตบิ ุคคล","ข":"รับได้ตามมาตรา 14 (4)","ค":"รับไม่ได้ เพราะไม่ใช่หน่วยงานของรัฐ และไม่ได้จัดตั้งโดยพระราชบัญญัติหรือพระราชกฤษฎีกา","ง":"รับได้เมื่ออัยการสูงสุดอนุญาต"},"answer":"ค"},{"id":69,"question":"นาย ง. พนักงานอัยการประจำสำนักงานอัยการจังหวัด ก. ต้องการเริ่มดำเนินคดีใหม่ในศาลจังหวัด ข. ซึ่ง อยู่นอกท้องที่ที่ตนรับราชการประจำ โดยไม่ได้รับคำสั่งให้ไปดำเนินคดี และมิใช่กรณีการส่งประเด็นหรือโอนคดี ตามมาตรา 15 (4) ข้อใดถูกต้อง","options":{"ก":"ทำได้ เพราะพนักงานอัยการมีอำนาจดำเนินคดีได้ทุกศาล","ข":"ทำไม่ได้ เว้นแต่จะมีคำสั่งตามมาตรา 15 (1) หรือ (2)","ค":"ทำได้ ถ้าศาลจังหวัด ข. อนุญาต","ง":"ทำได้ ถ้าอัยการจังหวัด ก. เห็นชอบ"},"answer":"ข"},{"id":70,"question":"อธิบดีอยั การภาคสั่งให้นาย จ. ซึ่งรับราชการประจำในจังหวัดหนึ่งภายในภาค ไปดำเนินคดีเฉพาะเรื่องใน ศาลจังหวัดอื่นภายในภาคเดียวกัน ต่อมาคดีขึ้นสู่ศาลอุทธรณ์และศาลฎีกา ข้อใดถูกต้อง","options":{"ก":"นาย จ. มีอำนาจดำเนินคดีได้ตลอดถึงศาลอุทธรณ์และศาลฎีกา","ข":"นาย จ. ดำเนินคดีได้เฉพาะในศาลชั้นต้น","ค":"ต้องได้รับคำสั่งอัยการสูงสุดเพิ่มเติมก่อนดำเนินคดีชั้นอุทธรณ์","ง":"ต้องโอนสำนวนให้สำนักงานอัยการคดีศาลสูงเท่านั้น"},"answer":"ก"},{"id":71,"question":"อธิบดีอัยการภาคแห่งหนึ่งสั่งให้พนักงานอัยการในภาคของตน ไปช่วยราชการและดำเนินคดีในศาลจังหวัด ที่อยู่ในภาคอื่น คำสั่งนี้ชอบด้วยมาตรา 15 หรือไม่","options":{"ก":"ชอบ เพราะอธิบดีอัยการภาคมีอำนาจสั่งได้ทั่วราชอาณาจักร","ข":"ชอบ ถ้าอธิบดีอัยการภาคอีกภาคหนึ่งยินยอม","ค":"ไม่ชอบ เพราะอำนาจสั่งของอธิบดีอัยการภาคจำกัดเฉพาะภายในภาค การสั่งข้ามภาคเป็นอำนาจของ อัยการสูงสุด","ง":"ไม่ชอบ เพราะไม่มีผู้ใดมีอำนาจสั่งข้ามภาคได้"},"answer":"ค"},{"id":72,"question":"รองอธิบดีอัยการผู้หนึ่งซึ่งรับราชการในส่วนกลาง ประสงค์จะว่าคดีด้วยตนเองในศาลจังหวัดแห่งหนึ่งใน ี ต่างจังหวัด โดยไม่มีคำสั่งใด ข้อใดถูกต้อง","options":{"ก":"ทำได้ เพราะรองอธิบดีอัยการมีอำนาจดำเนินคดีได้ทุกศาล","ข":"ทำได้ ถ้าเป็นคดีสำคัญ","ค":"ทำได้ ถ้าแจ้งอัยการจังหวัดในท้องที่นั้นทราบ","ง":"ทำไม่ ได้ เพราะมาตรา 15 ให้ อ ำนาจดำเนิ น คดี ได้ ทุ ก ศาลเฉพาะอั ย การสู งสุ ด และรองอั ย การสู งสุ ด จึงต้องมีคำสั่งตามมาตรา 15 (1)"},"answer":"ง"},{"id":73,"question":"พนักงานอัยการจังหวัดยื่นฟ้องคดีอาญาในศาลจังหวัด ต่อมาจำเลยอุทธรณ์ ผู้ใดมีอำนาจดำเนินคดีในชั้น อุทธรณ์ตามมาตรา 15 (3)","options":{"ก":"เฉพาะพนักงานอัยการผู้ดำเนินคดีมาแต่ต้น า","ข":"พนักงานอัยการผู้ดำเนินคดีนั้น พนักงานอัยการผู้อื่นซึ่งประจำศาลชั้นต้นนั้น หรือพนักงานอัยการซึ่งได้รับ แต่งตั้งหรือได้รบั มอบหมายจากอัยการสูงสุด","ค":"เฉพาะพนักงานอัยการที่อธิบดีอัยการภาคมอบหมาย","ง":"เฉพาะอธิบดีอัยการภาค"},"answer":"ข"},{"id":74,"question":"ศาลจังหวัด ก. โอนคดีที่พนักงานอัยการจังหวัด ก. ฟ้องไว้ไปพิจารณายังศาลจังหวัด ข. พนักงานอัยการผู้ ดำเนินคดีมาแต่ต้นจะไปดำเนินคดีต่อในศาลจังหวัด ข. ได้หรือไม่","options":{"ก":"ได้ ตามมาตรา 15 (4)","ข":"ไม่ได้ ต้องให้พนักงานอัยการประจำศาลจังหวัด ข. ดำเนินคดีเท่านั้น","ค":"ได้ เฉพาะเมื่ออัยการสูงสุดมีคำสั่ง","ง":"ไม่ได้ เพราะอยู่นอกท้องที่ที่รับราชการประจำ"},"answer":"ก"},{"id":75,"question":"พนั กงานอัย การซึ่ งรับราชการประจำอยู่ในราชการส่วนกลางในกรุงเทพมหานคร จะดำเนิน คดี ในศาล ชั้นต้นแห่งหนึ่งในกรุงเทพมหานครได้หรือไม่","options":{"ก":"ไม่ได้ ต้องมีคำสั่งอัยการสูงสุดเป็นรายคดี","ข":"ได้ เฉพาะศาลที่อธิบดีอัยการภาค 1 กำหนด","ค":"ได้ เพราะมาตรา 13 ให้เป็นพนักงานอัยการประจำศาลชั้นต้นทุกศาลในกรุงเทพมหานคร","ง":"ไม่ได้ เพราะในกรุงเทพมหานครต้องมีสำนักงานอัยการจังหวัดประจำศาล"},"answer":"ค"},{"id":76,"question":"พนักงานอัยการซึ่งรับว่าต่างคดีแพ่งให้กระทรวงแห่งหนึ่ง ต้องการข้อเท็จจริงจากเจ้าหน้าที่ของกระทรวง นั้น จึงออกคำสั่งเรียกมาให้ถ้อยคำ ข้อใดถูกต้อง","options":{"ก":"ทำไม่ได้ เพราะไม่ใช่คดีอาญา","ข":"ทำได้ตามมาตรา 14 วรรคสอง","ค":"ทำได้เฉพาะเมื่อศาลอนุญาต","ง":"ทำได้ตามมาตรา 16 เท่านั้น"},"answer":"ข"},{"id":77,"question":"ในคดีตามข้อ 76 พนักงานอัยการต้องการเรียกฝ่ายโจทก์ซึ่งเป็นคู่ความอีกฝ่ายหนึ่งมาให้ถ้อยคำ แต่โจทก์ ไม่ยินยอม ข้อใดถูกต้อง","options":{"ก":"ออกคำสั่งเรียกได้ และโจทก์ตอ้ งมาตามคำบังคับตามมาตรา 18","ข":"ออกคำสั่งเรียกได้ ถ้า ก.อ. เห็นชอบ","ค":"ออกคำสั่งเรียกได้ ถ้าเป็นคดีปกครอง","ง":"เรียกไม่ได้ เพราะมาตรา 14 วรรคสอง ห้ามเรียกคู่ความอีกฝ่ายหนึ่งโดยคู่ความฝ่ายนั้นไม่ยินยอม"},"answer":"ง"},{"id":78,"question":"ในคดีที่ต้องตั้งต้นที่พนักงานอัยการ พนักงานอัยการออกคำสั่งให้นาย ฉ. ซึ่งเป็นพยาน ไม่ใช่คู่ความหรือผู้ ี","options":{"ก":"ถือเป็นคำบังคับของพนักงานอัยการตามประมวลกฎหมายอาญา ตามมาตรา 18","ข":"เป็นเพียงคำขอความร่วมมือที่ไม่มีผลบังคับ","ค":"เป็นคำสั่งทางปกครองที่อุทธรณ์ต่อ ก.อ. ได้","ง":"มีผลบังคับเมื่อศาลออกหมายรับรอง จก"},"answer":"ก"},{"id":79,"question":"ในกรณีตามข้อ 78 หากผู้ได้รับคำสั่งเป็นผู้ถูกกล่าวหา แล้วไม่มาให้ถ้อยคำตามที่พนักงานอัยการเรียก ข้อ ใดถูกต้อง","options":{"ก":"ผู้ถูกกล่าวหามีความผิดฐานขัดคำบังคับทันที","ข":"พนักงานอัยการออกหมายจับได้ทันที","ค":"ผู้ถูกกล่าวหามีสิทธิไม่มาหรือไม่ให้ถ้อยคำได้ตามมาตรา 16 า","ง":"พนักงานอัยการต้องรายงาน ก.อ. เพื่อสั่งการ"},"answer":"ค"},{"id":80,"question":"กฎหมายเฉพาะฉบั บ หนึ่งให้ พนักงานอัยการมีอำนาจสอบสวนคดี อาญาเองโดยไม่ได้ ร่วมกับ พนักงาน สอบสวน ถ้าพนักงานอัยการต้องการค้นบ้านผู้ต้องหา ข้อใดถูกต้องตามมาตรา 17","options":{"ก":"ต้องส่งเรื่องให้พนักงานสอบสวนตำรวจทำการแทนทั้งหมด","ข":"มีอำนาจตามประมวลกฎหมายวิธีพิจารณาความอาญาในฐานะพนักงานฝ่ายปกครองหรือตำรวจชั้นผู้ใหญ่ และอาจร่วมกับหรือแจ้งให้เจ้าพนักงานตำรวจหรือเจ้าพนักงานอื่นดำเนินการก็ได้","ค":"ค้นได้โดยไม่ต้องปฏิบัติตามประมวลกฎหมายวิธีพิจารณาความอาญา","ง":"ค้นไม่ได้ เพราะพนักงานอัยการไม่มีอำนาจค้น"},"answer":"ข"},{"id":81,"question":"พนักงานอัยการได้รับมอบหมายให้ร่วมทำสำนวนสอบสวนกับพนักงานสอบสวนในคดีหนึ่ง ข้อใดถูกต้อง เกี่ยวกับมาตรา 17","options":{"ก":"พนักงานอัยการมีอำนาจเช่นเดียวกับพนักงานสอบสวนตามมาตรา 17 เสมอ","ข":"พนักงานอัยการเป็นหัวหน้าพนักงานสอบสวนโดยตำแหน่ง","ค":"ต้องขออนุมัติ ก.อ. ก่อนใช้มาตรา 17","ง":"มาตรา 17 ไม่ ใช้ บั งคั บ เพราะใช้ เฉพาะกรณี ที่มิ ใช่ การร่ว มสอบสวนหรือ ร่วมทำสำนวนสอบสวนกั บ พนักงานสอบสวน"},"answer":"ง"},{"id":82,"question":"อัยการสูงสุดออกคำสั่งมอบอำนาจสั่งไม่ฟ้องคดีอาญาที่ไม่เป็นประโยชน์แก่สาธารณชนตามมาตรา 21 ให้ รองอัยการสูงสุด คำสั่งมอบอำนาจนี้ชอบหรือไม่","options":{"ก":"ไม่ชอบ เพราะมาตรา 19 วรรคสอง ยกเว้นไม่ให้มอบอำนาจตามมาตรา 21","ข":"ชอบ เพราะรองอัยการสูงสุดเป็นผู้รับมอบอำนาจได้ตามมาตรา 19","ค":"ชอบ ถ้า ก.อ. เห็นชอบ","ง":"ชอบ ถ้าเป็นการมอบเป็นรายคดี"},"answer":"ก"},{"id":83,"question":"กฎหมายฉบับหนึ่งบัญญัติให้อำนาจบางประการแก่อัยการสูงสุดโดยไม่ได้กำหนดวิธีการมอบอำนาจไว้ และ อำนาจนั้นไม่อยู่ในข้อยกเว้นของมาตรา 19 วรรคสอง อัยการสูงสุดมอบอำนาจให้อธิบดีอัยการภาคพร้อมวาง ระเบียบให้ปฏิบัติ ข้อใดถูกต้อง","options":{"ก":"มอบได้ แต่วางระเบียบกำกับไม่ได้","ข":"มอบไม่ได้ เพราะต้องมอบให้รองอัยการสูงสุดเท่านั้น","ค":"มอบได้ และอัยการสูงสุดจะวางระเบียบให้ผู้รับมอบอำนาจต้องปฏิบัติด้วยก็ได้","ง":"มอบได้ เมื่อคณะรัฐมนตรีอนุมตั ิ"},"answer":"ค"},{"id":84,"question":"อั ยการสูงสุ ดประสงค์ จะมอบอำนาจตามประมวลกฎหมายวิ ธีพิ จารณาความอาญาซึ่ งเป็ น อำนาจของ ี อัยการสู งสุด (และไม่ อยู่ใ นข้อยกเว้น ) ให้ อัยการจัง หวัดแห่งหนึ่งโดยตรงตามมาตรา 19 วรรคสอง ข้อใด ถูกต้อง","options":{"ก":"มอบได้ เพราะอัยการจังหวัดเป็นพนักงานอัยการ","ข":"มอบไม่ได้ เพราะมาตรา 19 วรรคสอง ให้มอบได้เฉพาะรองอัยการสูงสุดหรืออธิบดีอัยการภาค","ค":"มอบได้ ถ้าเป็นคดีในท้องที่ของอัยการจังหวัดนั้น","ง":"มอบได้ ถ้าอธิบดีอัยการภาคเห็นชอบ"},"answer":"ข"},{"id":85,"question":"อัยการสูงสุดมอบหมายให้ข้าราชการฝ่ายอัยการผู้หนึ่งปฏิบัติหน้าที่แทนในการบริหารจัดการการพัสดุของ สำนักงานอัยการสูงสุด ข้อใดถูกต้อง","options":{"ก":"ทำไม่ได้ เพราะมอบได้เฉพาะรองอัยการสูงสุด า","ข":"ทำไม่ได้ เพราะต้องให้ ก.อ. ดำเนินการ","ค":"ทำได้ เฉพาะเมื่อมีพระราชกฤษฎีการองรับ","ง":"ทำได้ตามมาตรา 27 วรรคสอง"},"answer":"ง"},{"id":86,"question":"กฎหมายฉบับหนึ่งกำหนดให้พนักงานอัยการผู้ดำรงตำแหน่งหนึ่งเป็นกรรมการในคณะกรรมการ ต่อมาผู้ กรรมการได้หรือไม่","options":{"ก":"ได้ เพราะมาตรา 20 วรรคสอง ให้ผู้รักษาราชการแทนมีอำนาจและหน้าที่เป็นกรรมการด้วย","ข":"ไม่ได้ เพราะเป็นตำแหน่งเฉพาะตัว","ค":"ได้ ถ้าประธานกรรมการอนุญาต","ง":"ไม่ได้ เว้นแต่กฎหมายนั้นบัญญัติไว้เป็นการเฉพาะ"},"answer":"ก"},{"id":87,"question":"อัยการจั งหวัด เห็นว่ าการฟ้องคดีอาญาเรื่องหนึ่งจะมีผลกระทบต่อความมั่น คงของชาติ ข้อใดเป็น การ ปฏิบัติที่ถูกต้อง","options":{"ก":"อัยการจังหวัดสั่งไม่ฟ้องได้เองตามมาตรา 21","ข":"ส่งให้คณะรัฐมนตรีพิจารณา","ค":"เสนอต่ออัยการสูงสุด และอัยการสูงสุดมีอำนาจสั่งไม่ฟ้องได้","ง":"ส่งให้ ก.อ. วินิจฉัย"},"answer":"ค"},{"id":88,"question":"ศาลชั้นต้นพิพากษาในคดีอาญาคดีหนึ่ง พนักงานอัยการเห็นว่าการอุทธรณ์ต่อไปจะไม่เป็นประโยชน์แก่ สาธารณชน หากจะไม่อุทธรณ์ด้วยเหตุผลนี้ ต้องดำเนินการอย่างไร","options":{"ก":"ไม่อุทธรณ์ได้เองโดยไม่ต้องรายงานผู้ใด","ข":"เสนอต่ออัยการสูงสุดตามมาตรา 21 วรรคสองประกอบวรรคสาม","ค":"ขออนุญาตศาลไม่อุทธรณ์","ง":"ขอความเห็นชอบจากผู้เสียหาย"},"answer":"ข"},{"id":89,"question":"พนักงานอัยการสั่งไม่ฟ้องคดีอาญาโดยไม่ได้แสดงเหตุผลใดประกอบ ข้อใ "ก":"กำหนดนโยบายและรับผิดชอบในการปฏิบัติราชการของสำนักงานอัยการสูงสุดให้เกิดผลสัมฤทธิ์","ข":"แต่งตั้งพนักงานอัยการทุกตำแหน่ง","ค":"สั่งคดีแทนพนักงานอัยการทุกคดี","ง":"อนุมัติงบประมาณแผ่นดิน"},"answer":"ก"},{"id":251,"question":"มาตรา 27 (3) กำหนดอำนาจหน้าที่ของอัยการสูงสุดในเรื่องใด","options":{"ก":"การสั่งคดี","ข":"การฝึกอบรม","ค":"บริหารจัดการงบประมาณ การเงิน ทรัพย์สิน และการพัสดุของสำนักงานอัยการสูงสุด","ง":"การติดต่อต่างประเทศ"},"answer":"ค"},{"id":252,"question":"ตามมาตรา 27 วรรคสอง อัยการสูงสุดอาจมอบอำนาจให้ผู้ใดปฏิบัติหน้าที่แทนได้","options":{"ก":"รองอัยการสูงสุดเท่านั้น","ข":"รองอัยการสูงสุดหรือข้าราชการฝ่ายอัยการผู้หนึ่งผู้ใด","ค":"อธิบดีอัยการภาคเท่านั้น","ง":"บุคคลภายนอก"},"answer":"ข"},{"id":253,"question":"อำนาจออกระเบียบ ประกาศ หรือคำสั่งตามมาตรา 27 วรรคสี่ ใช้ในการปฏิบัติหน้าที่ตามอนุมาตราใด","options":{"ก":"มาตรา 27 (3) เท่านั้น","ข":"มาตรา 27 (1) (2) และ (3)","ค":"มาตรา 27 (2) เท่านั้น ี","ง":"มาตรา 27 (1) และ (2)"},"answer":"ง"},{"id":254,"question":"มาตรา 28 อยู่ในส่วนใดของ พ.ร.บ.","options":{"ก":"บทเฉพาะกาล","ข":"หมวด 1 องค์กรอัยการ","ค":"หมวด 2 พนักงานอัยการ","ง":"หมวด 3 สำนักงานอัยการสูงสุด"},"answer":"ก"},{"id":255,"question":"ตามมาตรา 30 ระเบียบหรือคำสั่งเดิมใช้บังคับต่อไปได้จนถึงเมื่อใด","options":{"ก":"ครบ 1 ปีนับแต่ พ.ร.บ.ใช้บังคับ","ข":"ครบ 2 ปีนับแต่ พ.ร.บ.ใช้บังคับ า","ค":"จนกว่าจะมีระเบียบ ประกาศ หรือคำสั่งของ ก.อ. หรือของอัยการสูงสุดที่ออกตาม พ.ร.บ.นี้ใช้บังคับ","ง":"จนกว่าคณะรัฐมนตรีจะมีมติยกเลิก"},"answer":"ค"},{"id":256,"question":"กฎหมายเดิมที่อา้ งถึง \"กรมอัยการ\" ให้ถือว่าอ้างถึงหน่วยงานใด","options":{"ก":"ก.อ.","ข":"สำนักงานอัยการสูงสุด","ค":"องค์กรอัยการ","ง":"กระทรวงยุติธรรม"},"answer":"ข"},{"id":257,"question":"กฎหมายเดิมที่อา้ งถึง \"อัยการพิเศษฝ่ายวิชาการ\" ให้ถือว่าอ้างถึงตำแหน่งใด","options":{"ก":"อัยการผู้เชี่ยวชาญ","ข":"อัยการพิเศษฝ่าย","ค":"รองอธิบดีอัยการ","ง":"อธิบดีอัยการ"},"answer":"ง"},{"id":258,"question":"กฎหมายเดิมที่อา้ งถึง \"รองอธิบดีอัยการฝ่าย\" ให้ถือว่าอ้างถึงตำแหน่งใด","options":{"ก":"รองอธิบดีอัยการ","ข":"รองอธิบดีอัยการภาค","ค":"อัยการพิเศษฝ่าย","ง":"รองอัยการสูงสุด"},"answer":"ก"},{"id":259,"question":"กฎหมายเดิมที่อา้ งถึง \"อัยการประจำกรม\" ให้ถือว่าอ้างถึงตำแหน่งใด","options":{"ก":"อัยการประจำกอง","ข":"อัยการผู้ช่วย","ค":"อัยการประจำสำนักงานอัยการสูงสุด","ง":"อัยการจังหวัดประจำสำนักงานอัยการสูงสุด"},"answer":"ค"},{"id":260,"question":"กฎหมายเดิมที่อา้ งถึง \"อัยการพิเศษฝ่ายปรึกษา\" ให้ถือว่าอ้างถึงตำแหน่งใด","options":{"ก":"ผู้ตรวจการอัยการ","ข":"อธิบดีอัยการ","ค":"อัยการผู้เชี่ยวชาญพิเศษ","ง":"อัยการอาวุโส ตอนที่ 2 เชิงวิเคราะห์ (ข้อ 261–300)"},"answer":"ข"},{"id":261,"question":"เทศบาลแห่งหนึ่งถูกฟ้องเป็นคดีปกครอง และนายกเทศมนตรีถูกฟ้องเป็นจำเลยร่วมในเรื่องที่ได้กระทำไป ตามหน้าที่ ข้อใดถูกต้อง","options":{"ก":"พนักงานอัยการต้องแก้ต่างให้ทั้งสองรายตามมาตรา 14 (3) ี","ข":"พนักงานอัยการแก้ต่างให้ได้เฉพาะนายกเทศมนตรี","ค":"พนักงานอัยการอาจรับแก้ต่างให้เทศบาลตามมาตรา 14 (5) และให้นายกเทศมนตรีตามมาตรา 14 (4) เมื่อเห็นสมควร","ง":"พนักงานอัยการแก้ต่างให้ไม่ได้ทั้งสองราย จก"},"answer":"ค"},{"id":262,"question":"จังหวัดแห่งหนึ่งซึ่งเป็นราชการส่วนภูมิภาคถูกฟ้องคดีแพ่ง และผู้ว่าราชการจังหวัดถูกฟ้องร่วมในเรื่องที่ ได้กระทำไปตามหน้าที่ ข้อใดถูกต้อง","options":{"ก":"การดำเนินคดีแทนจังหวัดเป็นอำนาจและหน้าที่ตามมาตรา 14 (3) ส่วนผู้ว่าราชการจังหวัดอาจรับแก้ต่าง ให้ได้เมื่อเห็นสมควรตามมาตรา 14 (4)","ข":"ทั้งสองรายอยู่ในมาตรา 14 (5) า","ค":"ทั้งสองรายอยู่ในมาตรา 14 (4)","ง":"พนักงานอัยการแก้ต่างให้ได้เฉพาะจังหวัด"},"answer":"ก"},{"id":263,"question":"องค์การบริหารส่วนจังหวัดประสงค์จะฟ้ององค์การบริหารส่วนตำบลแห่งหนึ่ง และขอให้พนักงานอัยการ ว่าต่างให้ตามมาตรา 14 (5) ข้อใดถูกต้อง","options":{"ก":"รับว่าต่างได้เมื่อเห็นสมควร","ข":"รับว่าต่างไม่ได้ เพราะเป็นข้อพิพาทระหว่างหน่วยงานของรัฐด้วยกันเอง","ค":"รับว่าต่างได้ถ้าผู้ว่าราชการจังหวัดเห็นชอบ","ง":"เป็นอำนาจและหน้าที่ตามมาตรา 14 (3)"},"answer":"ข"},{"id":264,"question":"ราษฎรผู้หนึ่งกระทำตามคำสั่งของเจ้าหน้าที่ของรัฐซึ่งสั่งการโดยมิชอบด้วยกฎหมาย แล้วถูกฟ้องคดีแพ่ง ราษฎรผู้นั้นจะอ้างกรณี \"กระทำตามคำสั่งของเจ้าหน้าที่ของรัฐ\" ตามมาตรา 14 (4) ได้หรือไม่","options":{"ก":"ได้ เพราะราษฎรไม่ทราบว่าคำสั่งมิชอบ","ข":"ได้ ถ้าเจ้าหน้าที่ของรัฐรับรอง","ค":"ได้ ถ้าเป็นคดีแพ่ง","ง":"ไม่ ได้ เพราะมาตรา 14 (4) ใช้ กั บ การกระทำตามคำสั่ งของเจ้ าหน้ าที่ ของรัฐ ซึ่งได้ ส่ั งการโดยชอบด้ ว ย กฎหมาย"},"answer":"ง"},{"id":265,"question":"นิ ติ บุค คลซึ่ ง มิ ใช่ ห น่ ว ยงานของรั ฐแต่จั ด ตั้ ง โดยพระราชกฤษฎี ก า มี ข้ อพิ พ าทกั บ รั ฐบาล และขอให้ พนักงานอัยการว่าต่างให้ตามมาตรา 14 (5) ข้อใดถูกต้อง","options":{"ก":"รับว่าต่างได้เมื่อเห็นสมควร","ข":"รับไม่ได้ เพราะมาตรา 14 (5) ยกเว้นกรณีที่เป็นข้อพิพาทกับรัฐบาล","ค":"รับได้ถ้า ก.อ. เห็นชอบ","ง":"รับได้ถ้าเป็นกระบวนการอนุญาโตตุลาการ"},"answer":"ข"},{"id":266,"question":"อัยการสูงสุดสั่งให้นาย ก. พนักงานอัยการประจำจังหวัด ก. ไปช่วยราชการชั่วคราวที่จังหวัด ข. ระหว่าง นั้นนาย ก. ประสงค์จะว่าคดีในศาลจังหวัด ค. ซึ่งไม่ได้รับคำสั่งให้ไป ข้อใดถูกต้อง","options":{"ก":"ทำได้ เพราะได้รับคำสั่งอัยการสูงสุดแล้ว","ข":"ทำได้ ถ้าจังหวัด ค. อยู่ในภาคเดียวกัน","ค":"ทำไม่ได้ เพราะอำนาจตามมาตรา 15 (1) ขยายเฉพาะศาลประจำท้องที่ท่ไี ปช่วยราชการ","ง":"ทำได้ ถ้าอัยการจังหวัด ค. ยินยอม"},"answer":"ค"},{"id":267,"question":"คดี ที่พนักงานอัยการจังหวัดดำเนินในศาลชั้น ต้น ขึ้นสู่การพิจารณาของศาลฎีกา อัยการสูงสุดแต่ งตั้ ง พนักงานอัยการในส่วนกลางให้ดำเนินคดีในชั้นฎีกา ข้อใดถูกต้อง ี","options":{"ก":"ทำได้ตามมาตรา 15 (3)","ข":"ทำไม่ได้ ต้องเป็นผู้ดำเนินคดีมาแต่ต้นเท่านั้น","ค":"ทำได้เฉพาะคดีแพ่ง","ง":"ทำได้เมื่อศาลฎีกาอนุญาต จก"},"answer":"ก"},{"id":268,"question":"ศาลจังหวัด ก. โอนคดีไปพิจารณายังศาลจังหวัด ข. พนักงานอัยการซึ่งประจำศาลจังหวัด ก. แต่ไม่ใช่ผู้ ดำเนินคดีมาแต่ต้น จะไปดำเนินคดีในศาลจังหวัด ข. ได้หรือไม่","options":{"ก":"ไม่ได้ เพราะไม่ใช่ผู้ดำเนินคดีมาแต่ต้น","ข":"ไม่ได้ เพราะอยู่นอกท้องที่","ค":"ได้ เฉพาะเมื่ออธิบดีอัยการภาคสั่ง า","ง":"ได้ เพราะมาตรา 15 (4) ให้พนักงานอัยการซึ่งประจำศาลที่ดำเนินคดีมาแต่ต้นมีอำนาจด้วย"},"answer":"ง"},{"id":269,"question":"อธิบดีอยั การภาคประสงค์จะว่าคดีด้วยตนเองในศาลจังหวัดแห่งหนึ่งภายในภาคของตน ข้อใดถูกต้อง","options":{"ก":"ทำไม่ได้ ต้องให้อัยการจังหวัดดำเนินการ","ข":"ทำได้ เพราะอธิบดีอัยการภาคมีอำนาจดำเนินคดีได้ทุกศาลภายในภาค","ค":"ทำได้เมื่ออัยการสูงสุดสั่ง","ง":"ทำได้เฉพาะชั้นอุทธรณ์"},"answer":"ข"},{"id":270,"question":"อธิบดีอัยการภาคประสงค์จะว่าคดีด้วยตนเองในศาลจังหวัด ที่อยู่นอกภาคของตน โดยไม่มีคำสั่งจาก อัยการสูงสุด ข้อใดถูกต้อง","options":{"ก":"ทำไม่ได้ เพราะอธิบดีอัยการภาคมีอำนาจดำเนินคดีได้เฉพาะศาลภายในภาค","ข":"ทำได้ เพราะเป็นผู้บริหารระดับสูง","ค":"ทำได้ ถ้าอธิบดีอัยการภาคท้องที่นั้นยินยอม","ง":"ทำได้ในคดีอาญาเท่านั้น"},"answer":"ก"},{"id":271,"question":"ในการตรวจสอบข้อเท็จจริงเพื่อดำเนินการตามรัฐธรรมนูญ พนักงานอัยการออกคำสั่งให้เจ้าหน้าที่ของรัฐ","options":{"ก":"เจ้าหน้าที่ผู้นั้นปฏิเสธได้เสมอ เพราะเป็นเอกสารราชการ","ข":"ต้องได้รับอนุญาตจากผู้บังคับบัญชาของเจ้าหน้าที่ก่อนจึงจะสั่งได้","ค":"คำสั่งนั้นมีฐานตามมาตรา 16 และถือเป็นคำบังคับของพนักงานอัยการตามประมวลกฎหมายอาญาตาม มาตรา 18","ง":"ต้องขอให้ศาลออกหมายเรียกเอกสาร"},"answer":"ค"},{"id":272,"question":"ระหว่างการแสวงหาข้อเท็จจริงตามมาตรา 16 พนักงานอัยการต้องการให้ห น่วยงานของรัฐแห่งหนึ่ ง ตรวจสอบข้อมูลบางประการให้ ข้อใดถูกต้อง","options":{"ก":"ทำไม่ได้ เพราะเป็นการก้าวล่วงหน่วยงานอื่น","ข":"ต้องขอมติคณะรัฐมนตรีก่อน","ค":"ต้องให้ ก.อ. เป็นผู้ส่งั","ง":"พนักงานอัยการอาจแจ้งให้เจ้าหน้าที่ผู้มีอำนาจหรือเจ้าหน้าที่ของรัฐดำเนินการตามที่เห็นสมควรได้"},"answer":"ง"},{"id":273,"question":"ในกรณี ที่กฎหมายกำหนดให้พ นักงานอัยการสอบสวนคดีอาญาเอง พนักงานอัย การประสงค์จะออก ี หมายเรียกผู้ต้องหามาสอบปากคำ ข้อใดถูกต้อง","options":{"ก":"ทำได้ เพราะมาตรา 17 ให้มีอำนาจและหน้าที่ในการสอบสวนเช่นเดียวกับพนักงานสอบสวนตามประมวล กฎหมายวิธีพิจารณาความอาญา","ค":"ทำได้เฉพาะเมื่อศาลอนุญาต","ข":"ทำไม่ได้ ต้องให้พนักงานสอบสวนตำรวจออกหมายแทน","ง":"ทำได้เฉพาะคดีที่มีโทษปรับ"},"answer":"ก"},{"id":274,"question":"พนักงานอัยการซึ่ งว่าต่างคดี แพ่งให้รัฐบาล ออกคำสั่งตามมาตรา 14 วรรคสอง เรียกบุคคลภายนอก ผู้เกี่ยวข้องมาให้ถ้อยคำ ข้อใดถูกต้องเกี่ยวกับมาตรา 18","options":{"ก":"คำสั่งนี้ถือเป็นคำบังคับตามประมวลกฎหมายอาญาตามมาตรา 18 า","ข":"มาตรา 18 ระบุเฉพาะคำสั่งตามมาตรา 16 แล },{"id":280,"question":"มีผู้มีอทิ ธิพลทางการเมืองกดดันให้พนักงานอัยการสั่งฟ้องคดีหนึ่งโดยไม่คำนึงถึงพยานหลักฐาน หลักตาม พ.ร.บ.องค์กรอัยการฯ ที่พนักงานอัยการต้องยึดถือคือข้อใด","options":{"ก":"ปฏิบัติตามนโยบายรัฐบาล","ข":"ให้ศาลเป็นผู้วินิจฉัยเสมอ า","ค":"ขอคำวินจิ ฉัยจากวุฒิสภา","ง":"มี อิสระในการพิจารณาสั่งคดีให้เป็นไปตามรัฐธรรมนูญ และตามกฎหมายโดยสุจ ริตและเที่ ยงธรรมตาม มาตรา 21 วรรคหนึ่ง"},"answer":"ง"},{"id":281,"question":"คณะรัฐมนตรีขอให้สำนักงานอัยการสูงสุดให้ความเห็นทางกฎหมายประกอบการพิจารณานโยบายเรื่อง หนึ่ง ซึ่งไม่ขัดต่องานในหน้าที่และความเป็นอิสระ ข้อใดถูกต้อง","options":{"ก":"ดำเนินการได้ตามมาตรา 23 (5)","ข":"ดำเนินการไม่ได้ เพราะเป็นงานของสำนักงานคณะกรรมการกฤษฎีกา","ค":"ดำเนินการได้เมื่อวุฒิสภาเห็นชอบ","ง":"ดำเนินการได้เฉพาะคดีที่อยู่ในศาล"},"answer":"ก"},{"id":282,"question":"สำนักงานอัยการสูงสุดตรวจร่างสัญญาให้กรมแห่งหนึ่ง และพบข้อที่อาจก่อให้เกิดความเสียหายแก่รัฐ แต่ไม่ได้รายงานให้กรมทราบ ข้อใดถูกต้อง","options":{"ก":"ไม่เป็นปัญหา เพราะเป็นดุลพินิจ","ข":"ไม่สอดคล้องกับหน้าที่ตามมาตรา 23 วรรคสอง","ค":"เป็นการปฏิบัติตามมาตรา 21","ง":"ไม่เป็นปัญหา ถ้ากรมไม่ได้ร้องขอ"},"answer":"ข"},{"id":283,"question":"สำนักงานอัยการสูงสุดจัดโครงการเผยแพร่ความรู้กฎหมายแก่ประชาชนในชุมชน ภารกิจนี้มีฐานตามบท ใด","options":{"ก":"มาตรา 23 (6)","ข":"มาตรา 23 (7)","ค":"มาตรา 23 (1)","ง":"มาตรา 14 (9)"},"answer":"ค"},{"id":284,"question":"หน่วยงานแห่งหนึ่งในฝ่ายบริหารแจ้งให้สำนักงานอัยการสูงสุดส่งคำของบประมาณผ่านกระทรวงของตน ข้อใดถูกต้องตามมาตรา 24","options":{"ก":"ต้องส่งผ่านกระทรวงยุติธรรม","ข":"ต้องส่งผ่านสำนักนายกรัฐมนตรี","ค":"ต้องส่งผ่าน ก.อ. ไปยังรัฐสภา","ง":"สำนักงานอัยการสูงสุดเสนองบประมาณรายจ่ายต่อคณะรัฐมนตรีเอง"},"answer":"ง"},{"id":285,"question":"สำนักงานการตรวจเงินแผ่นดินตรวจสอบรับรองบัญชีของสำนักงานอัยการสูงสุดแล้ว ต้องเสนอผลการ สอบบัญชีต่อวุฒิสภาด้วยหรือไม่ ี","options":{"ก":"ต้องเสนอ เพราะมาตรา 25 วรรคสอง ให้เสนอโดยตรงต่อสภาผู้แทนราษฎร วุฒสิ ภา และคณะรัฐมนตรี","ข":"ไม่ต้อง เสนอเฉพาะคณะรัฐมนตรี","ค":"ไม่ต้อง เสนอเฉพาะสภาผู้แทนราษฎร","ง":"เสนอเฉพาะเมื่อวุฒิสภาร "ก"},{"id":306,"question":"ระเบียบว่าด้วยการรักษาราชการแทนและการปฏิบัติราชการแทนพนักงานอัยการตามมาตรา 20 ผู้ใด เป็นผู้กำหนด","options":{"ก":"อัยการสูงสุด","ข":"คณะรัฐมนตรี","ค":"ก.อ.","ง":"สำนักงานอัยการสูงสุด"},"answer":"ค"},{"id":307,"question":"ข้อใดไม่ถูกต้องตามมาตรา 7","options":{"ก":"องค์กรอัยการประกอบด้วย ก.อ. อัยการสูงสุด และพนักงานอัยการอื่น า","ข":"สำนักงานอัยการสูงสุดอยู่ภายใต้การบังคับบัญชาของนายกรัฐมนตรี","ค":"สำนักงานอัยการสูงสุดเป็นนิติบุคคล","ง":"ข้าราชการฝ่ายอัยการสังกัดสำนักงานอัยการสูงสุด"},"answer":"ข"},{"id":308,"question":"\"หลักนิติธรรม\" ในฐานะหลักการปฏิบัติหน้าที่ขององค์กรอัยการ ปรากฏในมาตราใด","options":{"ก":"มาตรา 6","ข":"มาตรา 7","ค":"มาตรา 21","ง":"มาตรา 8"},"answer":"ง"},{"id":309,"question":"ตามลำดับในมาตรา 9 ตำแหน่งใดอยู่ร ะหว่าง \"อัยการจังหวัด \" กับ \"อัยการประจำสำนักงานอัยการ สูงสุด\"","options":{"ก":"อัยการจังหวัดประจำสำนักงานอัยการสูงสุด","ข":"รองอัยการจังหวัด","ค":"อัยการประจำกอง","ง":"อัยการผู้เชี่ยวชาญ"},"answer":"ก"},{"id":310,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 9","options":{"ก":"วรรคหนึ่งกำหนดตำแหน่งไว้ 18 ตำแหน่ง","ข":"ก.อ. ไม่มีอำนาจกำหนดตำแหน่งเพิ่มเติม","ค":"ตำแหน่งอัยการอาวุโสบัญญัติไว้ในวรรคสอง","ง":"ตำแหน่งอัยการอาวุโสเป็นลำดับที่ (18) ในวรรคหนึ่ง"},"answer":"ค"},{"id":311,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 10","options":{"ก":"การแต่งตั้งอัยการสูงสุดต้องเป็นไปตามมติ ก.อ.","ข":"การแต่งตั้งอัยการสูงสุดต้องได้รับความเห็นชอบจากวุฒิสภา","ค":"ประธานวุฒิสภาเป็นผู้ลงนามรับสนองพระบรมราชโองการแต่งตั้งอัยการสูงสุด","ง":"การแต่งตั้งรองอัยการสูงสุดต้องได้รับความเห็นชอบจากวุฒิสภาตามมาตรา 10"},"answer":"ง"},{"id":312,"question":"ข้อใดถูกต้องตามมาตรา 11","options":{"ก":"พนักงานอัยการเป็นทนายแผ่นดินประจำทุกศาลรวมทั้งศาลทหาร","ข":"พนักงานอัยการเป็นทนายแผ่นดินประจำศาลต่าง ๆ นอกจากศาลทหาร","ค":"กรอบอัตรากำลังกำหนดโดยคณะรัฐมนตรี ี","ง":"กรอบอัตรากำลังกำหนดโดยศาล"},"answer":"ข"},{"id":313,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 12","options":{"ก":"สำนักงานอัยการจังหวัดมีเฉพาะในท้องที่ที่ตั้งศาลจังหวัด","ข":"ในภาคหนึ่ง ๆ ให้มีสำนักงานอัยการภาค จก","ค":"หัวหน้าสำนักงานอัยการจังหวัดเรียกว่า อัยการจังหวัด","ง":"จำนวนพนักงานอัยการในสำนักงานอัยการภาคเป็นไปตามที่ ก.อ. กำหนด"},"answer":"ก"},{"id":314,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 13","options":{"ก":"ในกรุงเทพมหานครให้อธิบดีอัยการภาค 1 เป็นหัวหน้าพนักงานอัยการประจำศาลชั้นต้นทุกศาล","ข":"ในกรุงเทพมหานครต้องมีสำนักงานอัยการจังหวัดประจำศาลทุกศาล า","ค":"อัยการสูงสุดอาจมอบหมายให้อธิบดีอัยการเป็นหัวหน้าในการปฏิบัติราชการของพนักงานอัยการประจำ ศาลชั้นต้นในกรุงเทพมหานคร","ง":"มาตรา 13 ใช้กับทุกจังหวัด"},"answer":"ค"},{"id":315,"question":"ข้อใดถูกต้องเกี่ยวกับถ้อยคำในมาตรา 14","options":{"ก":"ทั้ง (3) (4) และ (5) ใช้ถ้อยคำว่า \"เมื่อเห็นสมควร\"","ข":"(3) ใช้ถ้อยคำว่า \"เมื่อเห็นสมควร\" แต่ (4) และ (5) ไม่ใช้","ค":"ทั้ง (3) (4) และ (5) เป็นหน้าที่ที่ต้องปฏิบัติ","ง":"(3) ใช้ถ้อยคำว่า \"มีอำนาจและหน้าที่\" ส่วน (4) และ (5) ใช้ถ้อยคำว่า \"เมื่อเห็นสมควร\""},"answer":"ง"},{"id":316,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 14","options":{"ก":"(2) ให้อำนาจหน้าที่ในคดีอาญาตามประมวลกฎหมายวิธีพิจารณาความอาญา","ข":"(4) ให้พนักงานอัยการรับว่าต่างให้เจ้าหน้าที่ของรัฐได้","ค":"(6) ให้พนักงานอัยการเป็นโจทก์ในคดีที่ราษฎรฟ้องเองไม่ได้โดยกฎหมายห้าม","ง":"(8) เกี่ยวกับการผิดสัญญาประกันตามประมวลกฎหมายวิธีพิจารณาความอาญา"},"answer":"ข"},{"id":317,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 14 (5)","options":{"ก":"ครอบคลุมหน่วยงานของรัฐซึ่งมิได้กล่าวใน (3) เช่น ราชการส่วนท้องถิ่น รัฐวิสาหกิจ องค์การมหาชน","ข":"ครอบคลุมนิติบุคคลเอกชนทุกประเภท","ค":"ครอบคลุมข้อพิพาทระหว่างหน่วยงานของรัฐด้วยกัน","ง":"ใช้เฉพาะคดีอาญา"},"answer":"ก"},{"id":318,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 14 (7) และ (8)","options":{"ก":"ใช้เฉพาะในกรุงเทพมหานคร","ข":"ต้องได้รับอนุมัติจาก ก.อ. ทุกครั้ง","ค":"ทั้งสองอนุมาตราบัญญัติมิให้เรียกค่าฤชาธรรมเนียมจากพนักงานอัยการ","ง":"ทั้งสองอนุมาตราเกี่ยวกับคดีแพ่ง"},"answer":"ค"},{"id":319,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 14 วรรคสองและวรรคสาม","options":{"ก":"พนักงานอัยการอาจออกคำสั่งเรียกบุคคลที่เกี่ยวข้องมาให้ถ้อยคำได้","ข":"จะเรียกคู่ความอีกฝ่ายมาให้ถ้อยคำโดยไม่ยินยอมไม่ได้","ค":"ระเบียบตามวรรคสามต้องประกาศในราชกิจจานุเบกษา ี","ง":"ระเบียบตามวรรคสามออกโดย ก.อ. แต่ผู้เดียว"},"answer":"ง"},{"id":320,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 15","options":{"ก":"อธิบดีอัยการภาคสั่งให้พนักงานอัยการไปดำเนินคดีนอกภาคได้ ภายในภาคได้","ข":"อธิบดีอัยการภาคอาจสั่งให้พนักงานอัยการซึ่งรับราชการประจำในภาคมีอำนาจดำเนินคดีในศาลทุกศาล","ค":"พนักงานอัยการทุกคนดำเนินคดีได้ทุกศาล","ง":"อัยการสูงสุดไม่มีอำนาจสั่งให้พนักงานอัยการไปดำเนินคดีเฉพาะเรื่อง"},"answer":"ข"},{"id":321,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 15","options":{"ก":"อธิบดีอัยการมีอำนาจดำเนินคดีได้ทุกศาล า","ข":"อัยการสูงสุดมีอำนาจดำเนินคดีได้ทุกศาล","ค":"รองอัยการสูงสุดมีอำนาจดำเนินคดีได้ทุกศาล","ง":"อธิบดีอัยการภาคมีอำนาจดำเนินคดีได้ทุกศาลภายในภาค"},"answer":"ก"},{"id":322,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 16","options":{"ก":"ใช้กับทุกคดีที่พนักงานอัยการดำเนินการ","ข":"ใช้เฉพาะคดีแพ่ง","ค":"ให้อำนาจออกหมายจับ","ง":"ใช้กับคดีที่ต้องตั้งต้นที่พนักงานอัยการ และการตรวจสอบข้อเท็จจริงเพื่อดำเนินการตามรัฐธรรมนูญ หรือ ตามกฎหมายอื่นใด"},"answer":"ง"},{"id":323,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 16","options":{"ก":"พนักงานอัยการสอบปากคำพยานบุคคลได้","ข":"พนักงานอัยการออกคำสั่งให้ส่งพยานหลักฐาน เอกสารหรือวัตถุได้","ค":"ผู้ถูกกล่าวหาต้องให้ถ้อยคำตามคำสั่งของพนักงานอัยการเสมอ","ง":"พนักงานอัยการอาจแจ้งให้เจ้าหน้าที่ของรัฐดำเนินการใดตามที่เห็นสมควรได้"},"answer":"ค"},{"id":324,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 17","options":{"ก":"ใช้เฉพาะกรณี ที่กฎหมายกำหนดให้พนั กงานอัยการมีอ ำนาจหน้าที่ สอบสวนคดีอาญาซึ่งมิ ใช่การร่ วม สอบสวนหรือร่วมทำสำนวนกับพนักงานสอบสวน","ข":"ใช้กับทุกคดีอาญา","ค":"ให้พนักงานอัยการเป็นพนักงานสอบสวนคดีพิเศษ","ง":"ห้ามพนักงานอัยการค้นหรือจับ"},"answer":"ก"},{"id":325,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 18","options":{"ก":"คำสั่งตามมาตรา 14 ถือเป็นคำบังคับตามประมวลกฎหมายอาญา","ข":"คำสั่งตามมาตรา 16 ถือเป็นคำบังคับของพนักงานอัยการตามประมวลกฎหมายอาญา","ค":"คำสั่งตามมาตรา 21 ถือเป็นคำพิพากษา","ง":"คำสั่งตามมาตรา 17 เป็นคำสั่งทางปกครอง"},"answer":"ข"},{"id":326,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 19","options":{"ก":"อัยการสูงสุดทำคำสั่งเฉพาะเรื่องหรือวางระเบียบให้พนักงานอัยการปฏิบัติได้","ข":"อัยการสูงสุดอาจมอบอำนาจให้อธิบดีอัยการภาคได้ ี","ค":"อัยการสูงสุดอาจวางระเบียบให้ผู้รบั มอบอำนาจปฏิบัติได้","ง":"อัยการสูงสุดมอบอำนาจตามมาตรา 21 ให้รองอัยการสูงสุดได้"},"answer":"ง"},{"id":327,"question":"การมอบอำนาจตามมาตรา 19 วรรคสอง ใช้ในกรณีใด","options":{"ก":"อำนาจของ ก.อ. ทุกประเภท จก","ข":"อำนาจบริหารงานบุคคลของสำนักงานอัยการสูงสุด","ค":"กฎหมายบัญญัติให้เป็นอำนาจของอัยการสูงสุด และมิได้กำหนดวิธีการมอบอำนาจไว้เป็นการเฉพาะ","ง":"อำนาจของพนักงานอัยการทุกคน"},"answer":"ค"},{"id":328,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 20","options":{"ก":"การรักษาราชการแทนตามระเบียบ ก.อ. ต้องเป็นไปภายใต้บังคับมาตรา 19 า","ข":"การรักษาราชการแทนเป็นไปตามคำสั่งนายกรัฐมนตรี","ค":"ผู้รักษาราชการแทนไม่มีอำนาจเป็นกรรมการตามกฎหมายอื่น","ง":"ใช้เฉพาะตำแหน่งอัยการสูงสุด"},"answer":"ก"},{"id":329,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 21","options":{"ก":"พนักงานอัยการมีอิสระในการพิจารณาสั่งคดี","ข":"พนักงานอัยการทุกคนสั่งไม่ฟ้องได้เองด้วยเหตุว่าการฟ้องไม่เป็นประโยชน์แก่สาธารณชน","ค":"อัยการสูงสุดมีอำนาจสั่งไม่ฟ้องเมื่อการฟ้องจะกระทบความมั่นคงของชาติ","ง":"ระเบียบตามวรรคสองออกโดยสำนักงานอัยการสูงสุดโดยความเห็นชอบของ ก.อ."},"answer":"ข"},{"id":330,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 21 วรรคสาม","options":{"ก":"ใช้กับคดีแพ่ง","ข":"ใช้กับการไม่ยื่นคำให้การ","ค":"ใช้กับการไม่คดั ค้านการประกันตัว","ง":"ให้นำวรรคสองมาใช้กับการถอนฟ้องโดยอนุโลม"},"answer":"ง"},{"id":331,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 22","options":{"ก":"ดุลพินิจทุกกรณีได้รบั ความคุ้มครองโดยไม่มีเงื่อนไข","ข":"ใช้เฉพาะดุลพินิจของอัยการสูงสุด","ค":"ดุลพินิจในการพิจารณาสั่งคดีที่ได้แสดงเหตุผลอันสมควรประกอบแล้วย่อมได้รับความคุ้มครอง","ง":"ใช้เฉพาะคดีแพ่ง"},"answer":"ค"},{"id":332,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 23","options":{"ก":"สำนักงานอัยการสูงสุดต้องดำเนินการตามที่คณะรัฐมนตรีร้องขอทุกกรณีโดยไม่มีข้อยกเว้น","ข":"สำนักงานอัยการสูงสุดให้ความรู้ทางกฎหมายแก่ประชาชน","ค":"สำนักงานอัยการสูงสุดดำเนินการเกี่ยวกับการฝึกอบรมข้าราชการฝ่ายอัยการ","ง":"สำนักงานอัยการสูงสุดติดต่อประสานงานกับหน่วยงานต่างประเทศได้"},"answer":"ก"},{"id":333,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 23","options":{"ก":"สำนักงานอัยการสูงสุดต้องตรวจร่างสัญญาให้เอกชนทุกราย","ข":"สำนักงานอัยการสูงสุดให้คำปรึกษาแก่นิติบุคคลซึ่งมิใช่หน่วยงานของรัฐแต่จัดตั้งโดยพระราชกฤษฎีกาได้ ตามที่เห็นสมควร ี","ค":"สำนักงานอัยการสูงสุดมีหน้าที่รักษาประโยชน์ของคู่สัญญาเอกชน","ง":"สำนักงานอัยการสูงสุดอนุมัติสัญญาแทนหน่วยงานของรัฐ"},"answer":"ข"},{"id":334,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 24","options":{"ข":"งบประมาณจัดสรรเป็นเงินอุดหนุน","ก":"สำนักงานอัยการสูงสุดเสนองบประมาณรายจ่ายต่อคณะรัฐมนตรี","ค":"สำนักงานอัยการสูงสุดเสนอคำขอแปรญัตติต่อคณะกรรมาธิการได้โดยตรง","ง":"สำนักงานอัยการสูงสุดเสนองบประมาณต่อ ก.อ. เพื่อพิจารณาจัดสรร"},"answer":"ง"},{"id":335,"question":"ข้อใดถูกต้องเกี่ยวกับมาตรา 25","options":{"ก":"สำนักงานอัยการสูงสุดตรวจสอบบัญชีของตนเอง า","ข":"สำนักงานการตรวจเงินแผ่นดินเสนอผลการสอบบัญชีต่อ ก.อ.","ค":"สำนักงานอัยการสูงสุดเป็นหน่วยรับตรวจ และผลการสอบบัญชีต้องเสนอโดยตรงต่อสภาผู้แทนราษฎร วุฒิสภา และคณะรัฐมนตรี","ง":"ผลการสอบบัญชีเสนอเฉพาะต่อคณะรัฐมนตรี"},"answer":"ค"},{"id":336,"question":"กฎหรือระเบียบฉบับ หนึ่งกำหนดให้กระทรวง ทบวง กรม ได้รับการผ่ อนผันการปฏิ บัติตามกฎหมายใน เรื่องหนึ่ง แต่ไม่ได้ระบุถึงสำนักงานอัยการสูงสุด ข้อใดถูกต้องตามมาตรา 26","options":{"ก":"สำนักงานอัยการสูงสุดได้รับการยกเว้นหรือผ่อนผันเช่นเดียวกับที่กฎหมายกำหนดให้แก่กระทรวง ทบวง กรม","ข":"ไม่ได้รับการผ่อนผัน เพราะสำนักงานอัยการสูงสุดไม่ใช่กระทรวง ทบวง กรม","ค":"ได้รับการผ่อนผันเฉพาะเมื่อคณะรัฐมนตรีอนุมัติเป็นรายกรณี","ง":"ได้รับการผ่อนผันเฉพาะเรื่องค่าธรรมเนียมศาลเท่านั้น"},"answer":"ก"},{"id":337,"question":"ข้อใดไม่ถูกต้องเกี่ยวกับมาตรา 27","options":{"ก":"อัยการสูงสุดรับผิดชอบการบริหารงานบุคคลของสำนักงานอัยการสูงสุด","ข":"อัยการสูงสุดออกระเบียบการพัสดุได้โดยไม่ต้องได้รบั ความเห็นชอบจาก ก.อ.","ค":"อัยการสูงสุดมอบอำนาจให้รองอัยการสูงสุดปฏิบัติหน้าที่แทนได้","ง":"อัยการสู ตรา 23 (5)","ข":"พนักงานอัยการต้องถอนฟ้องทันที า","ค":"ต้องให้วุฒิสภาเห็นชอบก่อน","ง":"เป็นคำขอที่อาจขัดต่อความเป็นอิสระตามข้อยกเว้นของมาตรา 23 (5) และการถอนฟ้องด้วยเหตุประโยชน์ สาธารณะต้องเป็นไปตามมาตรา 21 โดยอัยการสูงสุด"},"answer":"ง"},{"id":371,"question":"ข้อใดสรุปความเป็นอิสระด้านงบประมาณและการตรวจสอบของสำนักงานอัยการสูงสุดตาม พ.ร.บ. ได้ ถูกต้องที่สุด","options":{"ก":"เสนองบประมาณต่อคณะรัฐมนตรีเพื่อจัดสรรเป็นเงินอุดหนุน เสนอคำขอแปรญัตติต่อคณะกรรมาธิการได้ โดยตรง และยังเป็นหน่วยรับตรวจของการตรวจเงินแผ่นดิน","ข":"ได้รับงบประมาณผ่านกระทรวงยุติธรรม และไม่ต้องถูกตรวจสอบ","ค":"จัดทำงบประมาณเองโดยไม่ต้องผ่านคณะรัฐมนตรี และตรวจสอบบัญชีโดย ก.อ.","ง":"ได้รับงบกลาง และรายงานการเงินต่อศาล"},"answer":"ก"},{"id":372,"question":"มีผู้เสนอให้การบริหารงานบุคคลของสำนักงานอัยการสูงสุดอยู่ภายใต้ระบบเดียวกับส่วนราชการทั่วไป ของฝ่ายบริหาร ข้อใดสอดคล้องกับ พ.ร.บ.","options":{"ก":"สอดคล้อง เพราะสำนักงานอัยการสูงสุดเป็นส่วนราชการ","ข":"สอดคล้อง ถ้าคณะรัฐมนตรีเห็นชอบ","ค":"ไม่สอดคล้อง เพราะมาตรา 7 ให้สำนักงานอัยการสูงสุดมีอิสระในการบริหารงานบุคคล และมาตรา 27 (2) ให้อัยการสูงสุดรับผิดชอบการบริหารงานบุคคล","ง":"ไม่สอดคล้อง เพราะ ก.อ. เป็นผู้บริหารงบประมาณ"},"answer":"ค"},{"id":373,"question":"ก.อ. ประสงค์จะจัดตั้งภาคใหม่และกำหนดท้องที่ของภาค ข้อใดถูกต้อง","options":{"ก":"ต้องตราเป็นพระราชกฤษฎีกา","ข":"ทำเป็นประกาศ ก.อ. ตามมาตรา 7 วรรคสี่ และใช้บังคับเมื่อประกาศในราชกิจจานุเบกษาตามมาตรา 5","ค":"ให้อัยการสูงสุดออกคำสั่ง","ง":"ต้องแก้ไข พ.ร.บ."},"answer":"ข"},{"id":374,"question":"เจ้าพนักงานตำรวจผู้หนึ่งถูกราษฎรฟ้องคดีอาญาจากการจับกุมผู้ต้องหาตามหน้าที่ ข้อใดถูกต้อง","options":{"ก":"พนักงานอัยการแก้ต่างให้ไม่ได้ เพราะพนักงานอัยการเป็นผู้ฟ้องคดีอาญา","ข":"ต้องให้สำนักงานตำรวจแห่งชาติจ้างทนายเท่านั้น","ค":"พนักงานอัยการต้องแก้ต่างให้ทกุ กรณี","ง":"พนักงานอัยการอาจรับแก้ต่างให้ได้เมื่อเห็นสมควรตามมาตรา 14 (4)"},"answer":"ง"},{"id":375,"question":"หน่วยงานของรัฐแห่งหนึ่งซึ่งไม่ใช่รัฐบาล องค์กรตามรัฐธรรมนูญ ราชการส่วนกลาง หรือราชการส่วน","options":{"ก":"พนักงานอัยการอาจรับแก้ต่างให้ได้เมื่อเห็นสมควรตามมาตรา 14 (5)","ข":"เป็นอำนาจและหน้าที่ตามมาตรา 14 (3) ี","ค":"พนักงานอัยการรับไม่ได้ทุกกรณี","ง":"รับได้ตามมาตรา 14 (4)"},"answer":"ก"},{"id":376,"question":"ข้อใดเปรียบเทียบสถานะขององค์กรตามรัฐธรรมนูญกับรัฐวิสาหกิจตามมาตรา 14 ได้ถูกต้อง","options":{"ก":"ทั้งสองอยู่ในมาตรา 14 (3)","ข":"ทั้งสองอยู่ในมาตรา 14 (5)","ค":"องค์ ก รตามรัฐ ธรรมนู ญ อยู่ ใน (3) ซึ่ งเป็ น อำนาจและหน้ า ที่ ส่ ว นรั ฐ วิ ส าหกิ จ อยู่ ใ น (5) ซึ่ งรับ ได้ เมื่ อ เห็นสมควร","ง":"องค์กรตามรัฐธรรมนูญอยู่ใน (5) ส่วนรัฐวิสาหกิจอยู่ใน (3)"},"answer":"ค"},{"id":377,"question":"อัยการสูงสุดสั่งให้พนักงานอัยการผู้หนึ่งไปดำเนินคดีเฉพาะเรื่องตามมาตรา 15 (1) โดยคำสั่งไม่ได้ระบุ า ชั้นศาล ต่อมาคดีขึ้นสู่ศาลฎีกา ข้อใดถูกต้อง","options":{"ก":"ผู้นั้นดำเนินคดีได้เฉพาะศาลชั้นต้น เพราะคำสั่งไม่ระบุ","ข":"ผู้นั้นมีอำนาจดำเนินคดีได้ตลอดถึงศาลอุทธรณ์และศาลฎีกาตามที่มาตรา 15 (1) บัญญัติ","ค":"ต้องขอคำสั่งใหม่จาก ก.อ.","ง":"ต้องโอนคดีให้อธิบดีอัยการภาค"},"answer":"ข"},{"id":378,"question":"ในคดีที่ต้องตั้งต้นที่พนักงานอัยการ พนักงานอัยการสั่งให้ผู้ถูกกล่าวหาส่งเอกสาร แต่ผู้ถูกกล่าวหาปฏิเสธ ข้อใดถูกต้อง","options":{"ก":"ผู้ถูกกล่าวหามีความผิดฐานขัดคำบังคับ","ข":"พนักงานอัยการค้นยึดได้ทันทีโดยไม่ต้องมีหมาย","ค":"ต้องรายงานศาลเพื่อสั่งการ","ง":"ผู้ถูกกล่าวหามีสิทธิไม่ส่งเอกสารตามที่เรียกได้ตามมาตรา 16"},"answer":"ง"},{"id":379,"question":"ในกรณี ที่ก ฎหมายกำหนดให้พ นั กงานอั ย การสอบสวนคดีอ าญาเอง พนั กงานอั ยการประสงค์จะจั บ ผู้ต้องหา ข้อใดถูกต้อง","options":{"ก":"อาจจับร่วมกับเจ้า พนักงานตำรวจ หรือแจ้งให้เจ้าพนักงานตำรวจหรือเจ้าพนักงานอื่น ดำเนินการก็ได้ ตามมาตรา 17","ข":"ต้องจับเองเท่านั้น","ค":"ไม่มีอำนาจเกี่ยวกับการจับ","ง":"ต้องได้รับอนุมัติจาก ก.อ."},"answer":"ก"},{"id":380,"question":"ในกรณีตามข้อ 379 พนักงานอัยการออกคำสั่งเรียกพยานบุคคลมาให้การ คำสั่งนั้นมีสถานะอย่างไร","options":{"ก":"เป็นเพียงหนังสือขอความร่วมมือ","ข":"เป็นคำสั่งทางปกครอง","ค":"ถือเป็นคำบังคับของพนักงานอัยการตามประมวลกฎหมายอาญา ตามมาตรา 18","ง":"เป็นหมายเรียกของศาล"},"answer":"ค"},{"id":381,"question":"กฎหมายฉบับหนึ่งกำหนดให้อธิบดีอัยการภาคมีอำนาจหน้าที่บางประการ ขณะที่อธิบดีอัยการภาคไม่อยู่ ี","options":{"ก":"ผู้รักษาราชการแทนไม่มีอำนาจตามกฎหมายอื่น","ข":"ผู้รักษาราชการแทนมีอำนาจหน้าที่เช่นเดียวกับผู้ดำรงตำแหน่งตามมาตรา 20 วรรคสอง","ค":"ต้องได้รับมอบอำนาจจากอัยการสูงสุดเป็นรายเรื่อง","ง":"ต้องรอให้อธิบดีอัยการภาคกลับมา จก"},"answer":"ข"},{"id":382,"question":"พนักงานอัยการเห็นว่าการยื่นคำร้องในคดีอาญาเรื่องหนึ่งจะไม่เป็นประโยชน์แก่สาธารณชน จึงประสงค์ จะไม่ยื่นคำร้องด้วยเหตุนี้ ข้อใดถูกต้อง","options":{"ก":"ไม่ยื่นได้เองตามดุลพินิจ","ข":"ต้องขออนุญาตศาล","ค":"ต้องขอความเห็นจากผู้เสียหาย า","ง":"ต้องเสนอต่ออัยการสูงสุดตามมาตรา 21 วรรคสองประกอบวรรคสาม"},"answer":"ง"},{"id":383,"question":"พนักงานอัยการสั่งไม่ฟ้องคดีหนึ่งโดยสุจริตพร้อมแสดงเหตุผลอันสมควร ต่อมาผู้เสียหายฟ้องคดีเองและ ศาลพิพากษาลงโทษจำเลย ข้อใดถูกต้อง","options":{"ก":"ดุลพินิจของพนักงานอัยการซึ่งได้แสดงเหตุผลอันสมควรประกอบแล้ว ยังได้รับความคุ้มครองตามมาตรา 22","ข":"ดุลพินิจของพนักงานอัยการสิ้นความคุ้มครองทันที","ค":"พนักงานอัยการต้องรับผิดทางอาญาโดยอัตโนมัติ","ง":"คำสั่งไม่ฟ้องเป็นโมฆะ"},"answer":"ก"},{"id":384,"question":"ประชาชนผู้หนึ่งถูกละเมิดสิทธิและขอให้สำนักงานอัยการสูงสุดช่วยเหลือคุ้มครองป้องกันสิทธิ ภารกิจนี้มี ฐานตามบทใด","options":{"ก":"มาตรา 14 (4)","ข":"มาตรา 23 (5)","ค":"มาตรา 23 (1)","ง":"มาตรา 23 (7)"},"answer":"ค"},{"id":385,"question":"นิ ติ บุ คคลซึ่งมิใช่ห น่วยงานของรัฐแต่ จัดตั้ งโดยพระราชบัญ ญั ติ ขอให้ตรวจร่า งสั ญ ญา แต่ สำนักงาน อัยการสูงสุดเห็นว่าไม่สมควรรับ ข้อใดถูกต้อง","options":{"ก":"ปฏิเสธไม่ได้ เพราะเป็นหน้าที่ตามกฎหมาย","ข":"ปฏิเสธได้ เพราะมาตรา 23 (3) ใช้ถ้อยคำว่า \"ตามที่เห็นสมควร\"","ค":"ต้องเสนอคณะรัฐมนตรีวินิจฉัย","ง":"ต้องเสนอ ก.อ. วินิจฉัย"},"answer":"ข"},{"id":386,"question":"ข้อใดเปรียบเทียบมาตรา 23 (2) กับ (3) ได้ถูกต้อง","options":{"ก":"ทั้งสองอนุมาตราใช้ถ้อยคำ \"ตามที่เห็นสมควร\"","ข":"ทั้งสองอนุมาตราใช้กับเอกชนทั่วไป","ค":"(2) ใช้กับนิติบุคคลที่ตั้งโดย พ.ร.บ. ส่วน (3) ใช้กับรัฐบาล","ง":"(3) มีถ้อยคำ \"ตามที่เห็นสมควร\" แต่ (2) ซึ่งใช้กับรัฐบาลและหน่วยงานของรัฐไม่มีถ้อยคำดังกล่าว"},"answer":"ง"},{"id":387,"question":"อัยการสูงสุดมอบอำนาจบริหารจัดการงบประมาณให้ข้าราชการฝ่ายอัยการผู้หนึ่ง และประสงค์จะมอบ อำนาจตามประมวลกฎหมายวิธีพิจารณาความอาญาให้บุคคลเดียวกันด้วย (บุคคลนั้นไม่ใช่รองอัยการสูงสุด หรืออธิบดีอัยการภาค) ข้อใดถูกต้อง ี","options":{"ก":"มอบอำนาจบริหารงบประมาณได้ตามมาตรา 27 วรรคสอง แต่มอบอำนาจตามมาตรา 19 วรรคสองให้ บุคคลนั้นไม่ได้","ข":"มอบได้ท้งั สองกรณี","ค":"มอบไม่ได้ทั้งสองกรณี จก","ง":"มอบอำนาจตามมาตรา 19 ได้ แต่มอบอำนาจบริหารงบประมาณไม่ได้"},"answer":"ก"},{"id":388,"question":"ระเบียบเดิมของ \"กรมอัยการ\" ว่าด้วยการปฏิบัติหน้าที่ของพนักงานอัยการ ยังไม่มีระเบียบใหม่ออกมา แทน ข้อใดถูกต้อง","options":{"ก":"ระเบียบเดิมสิ้นผลทันที","ข":"ระเบียบเดิมใช้ได้ทั้งฉบับแม้ขัด พ.ร.บ. า","ค":"ระเบียบเดิมใช้ต่อไปเท่าที่ ไม่ขัดหรือแย้งกับ พ.ร.บ. (มาตรา 30) และคำว่ากรมอั ยการให้ถือว่า อ้างถึ ง สำนักงานอัยการสูงสุด (มาตรา 31)","ง":"ต้องให้คณะรัฐมนตรีรับรองระเบียบเดิมก่อน"},"answer":"ค"},{"id":389,"question":"คณะรัฐมนตรีมีมติให้อัยการสูงสุดพ้นจากตำแหน่ง ข้อใดถูกต้อง","options":{"ก":"มีผลทันที","ข":"ไม่มีผลตามมาตรา 10 เพราะการให้อัยการสูงสุดพ้นจากตำแหน่งต้องเป็นไปตามมติ ก.อ. และได้รับความ เห็นชอบจากวุฒิสภา","ค":"มีผลเมื่อประธานวุฒิสภารับทราบ","ง":"มีผลเมื่อ ก.อ. รับทราบ"},"answer":"ข"},{"id":390,"question":"ข้อใดอธิบายการจัดองค์กรพนักงานอัยการในกรุงเทพมหานครได้ถูกต้อง","options":{"ก":"มีสำนักงานอัยการจังหวัดประจำศาลทุกศาลตามมาตรา 12 วรรคสอง","ข":"อธิบดีอัยการภาค 1 เป็นหัวหน้าพนักงานอัยการประจำศาลชั้นต้นทุกศาล","ค":"พนักงานอัยการทั่วประเทศเป็นพนักงานอัยการประจำศาลชั้นต้นในกรุงเทพมหานคร","ง":"มาตรา 12 วรรคสอง ยกเว้นเขตกรุงเทพมหานคร และการประจำศาลชั้นต้นในกรุงเทพมหานครเป็นไป ตามมาตรา 13"},"answer":"ง"},{"id":391,"question":"พนักงานอัยการพิจารณาแล้วไม่รับแก้ต่างให้เจ้าหน้าที่ของรัฐผู้หนึ่งที่ถูกฟ้องในเรื่องที่ได้กระทำไปตาม หน้าที่ เพราะเห็นว่าไม่สมควร ข้อใดถูกต้อง","options":{"ก":"ทำได้ เพราะมาตรา 14 (4) เป็นดุลพินิจ \"เมื่อเห็นสมควร\"","ข":"ทำไม่ได้ เพราะเป็นหน้าที่ตามกฎหมาย","ค":"ทำได้เฉพาะเมื่อ ก.อ. อนุมัติ","ง":"ทำไม่ได้ ถ้าหน่วยงานต้นสังกัดร้องขอ"},"answer "answer":"ข"},{"id":398,"question":"อั ย การสู ง สุ ด มอบหมายให้ พ นั ก งานอั ย การผู้ ห นึ่ ง ปฏิ บั ติ ภ ารกิ จ ติ ด ต่ อ ประสานงานกั บ หน่ ว ยงาน ต่างประเทศ ซึ่งเป็นอำนาจหน้าที่ของสำนักงานอัยการสูงสุด ฐานอำนาจของพนักงานอัยการผู้นั้นคือข้อใด","options":{"ก":"มาตรา 14 (1)","ข":"มาตรา 14 (9)","ค":"มาตรา 23 (7)","ง":"มาตรา 14 (11)"},"answer":"ง"},{"id":399,"question":"การแต่งตั้งรองอัยการสูงสุดเป็นไปตามข้อใด","options":{"ก":"กฎหมายว่าด้วยระเบียบข้าราชการฝ่ายอัยการตามมาตรา 10 วรรคสอง โดยไม่อยู่ในบังคับต้องได้รับความ ี เห็นชอบจากวุฒิสภาตามมาตรา 10 วรรคหนึ่ง","ข":"ต้องได้รับความเห็นชอบจากวุฒิสภา","ค":"ต้องได้รับความเห็นชอบจากคณะรัฐมนตรี","ง":"อัยการสูงสุดแต่งตั้งโดยลำพัง จก"},"answer":"ก"},{"id":400,"question":"ข้อใดสรุปหลักความเป็นอิสระขององค์กรอัยการตาม พ.ร.บ.องค์กรอัยการฯ ได้ถูกต้องที่สุด","options":{"ก":"พนักงานอัยการต้องปฏิบัติตามนโยบายรัฐบาลในการสั่งคดี","ข":"ความเป็นอิสระมีเฉพาะด้านงบประมาณ","ค":"สำนักงานอัยการสูงสุดมีอิสระในการบริหารงานบุคคล งบประมาณ และการดำเนินการอื่น (ม.7) พนักงาน อัยการมีอิสระในการสั่งคดี (ม.21) และดุลพินิจที่แสดงเหตุผลอันสมควรได้รับความคุ้มครอง (ม.22) า","ง":"อัยการสูงสุดสั่งคดีแทนพนักงานอัยการทุกคดี"},"answer":"ค"}];
let paper=[],answers={},idx=0,mode='immediate',graded=false;
const $=id=>document.getElementById(id);const letters=['ก','ข','ค','ง'];
function start(){let s=$('set').value,c=$('count').value;let pool=BANK.filter(q=>s==='all'||Math.ceil(q.id/100)==+s);if(c!=='all')pool=pool.sort(()=>Math.random()-.5).slice(0,+c);paper=pool.sort((a,b)=>a.id-b.id);answers={};idx=0;mode=$('mode').value;graded=false;$('setup').classList.add('hide');$('result').classList.add('hide');$('quiz').classList.remove('hide');render()}
function render(){let q=paper[idx];$('position').textContent=`ข้อ ${idx+1} / ${paper.length}`;$('answered').textContent=`ตอบแล้ว ${Object.keys(answers).length} ข้อ`;$('bar').style.width=((idx+1)/paper.length*100)+'%';$('setlabel').textContent='ชุดที่ '+Math.ceil(q.id/100);$('number').textContent='ข้อเดิม '+q.id;$('questionText').textContent=q.question;$('options').innerHTML='';letters.forEach((l,i)=>{let div=document.createElement('label');div.className='option'+(answers[q.id]===l?' selected':'');let radio=document.createElement('input');radio.type='radio';radio.name='answer';radio.value=l;radio.checked=answers[q.id]===l;radio.disabled=graded||(mode==='immediate'&&answers[q.id]);radio.addEventListener('change',()=>{answers[q.id]=l;render()});let span=document.createElement('span');span.textContent=l+'. '+(q.options[l]||'');div.append(radio,span);if(graded){if(l===q.answer)div.classList.add('correct');else if(answers[q.id]===l)div.classList.add('wrong')}$('options').append(div)});
$('feedback').innerHTML='';if(mode==='immediate'&&answers[q.id]){$('feedback').innerHTML=`<p class="feedback">${answers[q.id]===q.answer?'✓ ตอบถูกต้อง':'✗ ยังไม่ถูกต้อง'} — เฉลย: <b>${q.answer}</b></p>`}
if(graded){$('feedback').innerHTML=`<p class="feedback">เฉลย: <b>${q.answer}</b> ${answers[q.id]===q.answer?'• ตอบถูก':'• ตอบผิดหรือไม่ได้ตอบ'}</p>`}
$('prev').disabled=idx===0;$('next').textContent=idx===paper.length-1?'ไปข้อแรก':'ข้อถัดไป';$('next').disabled=paper.length<2}
function score(){return paper.filter(q=>answers[q.id]===q.answer).length}
function finish(){graded=true;let sc=score();$('quiz').classList.add('hide');$('result').classList.remove('hide');let pct=Math.round(sc/paper.length*100);$('result').innerHTML=`<div class="result"><span class="tag">สรุปผลการทดสอบ</span><h2>คะแนนของคุณ</h2><div class="score">${sc} / ${paper.length}</div><p>คิดเป็น ${pct}%</p><p class="muted">ตอบถูก ${sc} ข้อ • ตอบผิด/ไม่ตอบ ${paper.length-sc} ข้อ</p><button id="reviewBtn" style="max-width:220px;margin:10px auto">ดูเฉลยทุกข้อ</button> <button id="againBtn" class="secondary" style="max-width:220px;margin:10px auto">กลับหน้าเลือกชุด</button></div><div id="review" class="hide"></div>`;$('reviewBtn').onclick=()=>{let r=$('review');r.classList.toggle('hide');r.innerHTML=paper.map((q,i)=>`<div class="review-item"><b>ข้อ ${q.id}. ${esc(q.question)}</b><p class="muted">คำตอบของคุณ: ${answers[q.id]||'ไม่ได้ตอบ'} | เฉลย: <b>${q.answer}</b> ${answers[q.id]===q.answer?'✓':'✗'}</p>${letters.map(l=>`<div>${l}. ${esc(q.options[l]||'')}</div>`).join('')}</div>`).join('')};$('againBtn').onclick=()=>{$('result').classList.add('hide');$('setup').classList.remove('hide')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=start;$('prev').onclick=()=>{if(idx>0){idx--;render()}};$('next').onclick=()=>{idx=idx===paper.length-1?0:idx+1;render()};$('submit').onclick=()=>{if(confirm('ยืนยันส่งคำตอบเพื่อคิดคะแนนหรือไม่?'))finish()};
</script></body></html>
